[project]
name = "timelapse-maker"
version = "0.1.0"
description = "Capture timelapse images and assemble them into videos, with phone-as-webcam support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.12.0.88",
    "Pillow>=10.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
